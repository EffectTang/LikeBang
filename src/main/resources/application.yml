server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev

likebang:
  snowflake:
    worker-id: ${WORKER_ID:1}
    datacenter-id: ${DC_ID:1}
  auth:
    # JWT 签名密钥，至少32字节，生产环境必须通过环境变量 JWT_SECRET 覆盖
    jwt-secret: ${JWT_SECRET:likebang-dev-jwt-secret-please-change-me-0123456789}
    # Token 有效期（毫秒），默认7天
    jwt-timeout: ${JWT_TIMEOUT:604800000}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.likebang.modules.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
