server:
  port: 8080
  servlet:
    context-path: /api

spring:
  profiles:
    active: dev
  servlet:
    multipart:
      # 单张图片上限 5MB，单次请求上限 10MB（超限由 GlobalExceptionHandler 前拦截为 400）
      max-file-size: 5MB
      max-request-size: 10MB
  mail:
    # 找回密码邮件通道：host 为空则视为未配置（重置接口返回明确提示，不静默失败）
    # 生产凭证务必走环境变量注入，禁止提交明文（QQ/163 需用 SMTP 授权码而非登录密码）
    host: ${MAIL_SMTP_HOST:}
    port: ${MAIL_SMTP_PORT:465}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      # 465 端口走 SSL（JavaMail 默认未启用 SSL 套接字，需显式开启）
      mail.smtp.ssl.enable: "${MAIL_SMTP_SSL_ENABLE:true}"

likebang:
  file:
    # 图片存储模式：local（本地磁盘，默认）| cloudbase（腾讯 CloudBase 云存储）
    storage-mode: ${FILE_STORAGE_MODE:local}
    # 图片本地存储根目录（生产建议通过环境变量 UPLOAD_PATH 指向独立数据盘）
    storage-path: ${UPLOAD_PATH:./uploads}
    # 对外访问前缀，需与 WebConfig 静态资源映射保持一致
    access-prefix: /uploads
    # CloudBase 传统模式云存储（storage-mode=cloudbase 时生效）
    cloudbase:
      # 环境 ID：开放接口网关域名与 cloudObjectId 均基于它拼接
      env-id: ${CLOUDBASE_ENV_ID:}
      # API Key（管理员权限、长期有效）：仅服务端持有，严禁提交仓库/下发客户端
      api-key: ${CLOUDBASE_API_KEY:}
      # 公有读 CDN 域名前缀：落库存的永久链接 = 本前缀 + objectId（安全规则须“所有用户可读”）
      cdn-base-url: ${CLOUDBASE_CDN_BASE_URL:}
      # 云存储对象目录前缀（不可 / 开头）
      object-prefix: images
  snowflake:
    worker-id: ${WORKER_ID:1}
    datacenter-id: ${DC_ID:1}
  auth:
    # JWT 签名密钥，至少32字节，生产环境必须通过环境变量 JWT_SECRET 覆盖
    jwt-secret: ${JWT_SECRET:likebang-dev-jwt-secret-please-change-me-0123456789}
    # Token 有效期（毫秒），默认7天
    jwt-timeout: ${JWT_TIMEOUT:604800000}
    # 内置超级管理员账号，不可被禁用/删除/改角色（与 schema.sql 播种账号保持一致）
    super-admin-username: ${SUPER_ADMIN_USERNAME:admin}
    # 微信小程序登录凭据：需自行申请，未配置时调用 /user/auth/wx-login 返回"微信登录未配置"
    wx:
      # AppID：登录微信公众平台 https://mp.weixin.qq.com -> 开发 -> 开发管理 -> 开发设置 -> 小程序ID
      app-id: ${WX_APP_ID:}
      # AppSecret：同页面"小程序密钥"处生成，属敏感信息，切勿提交仓库，生产通过环境变量 WX_APP_SECRET 注入
      app-secret: ${WX_APP_SECRET:}
      env-version: develop
    # 找回密码（邮件重置链接）：邮件通道依赖上方 spring.mail，未配置时重置申请不可用
    password-reset:
      # 邮件中重置链接的 Web 站点前缀（生产改为正式域名，如 https://likebang.example.com）
      web-base-url: ${RESET_WEB_BASE_URL:http://localhost:5173}
      # 发件人地址，缺省取 spring.mail.username
      from: ${MAIL_FROM:}
      # 重置链接有效期（分钟），默认 30 分钟
      expiry-minutes: ${RESET_TOKEN_EXPIRY_MINUTES:30}

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.likebang.modules.**.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: assign_id
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0
